name: Public production smoke check (temporary)
on:
  push:
    branches:
      - test/verify-sentry-pnpm-20261106
    paths:
      - .github/workflows/check-live.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public frontend, API, and browser Sentry config
        run: |
          node --input-type=module <<'NODE'
          let errors = 0;
          const check = async (name, url, expected) => {
            const start = Date.now();
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
              const content = await response.text();
              const ok = response.status === 200 && expected.test(content);
              console.log(name, JSON.stringify({
                status: response.status,
                ms: Date.now()-start,
                passed: ok,
                bytes: content.length,
              }));
              if (!ok) errors++;
              return content;
            } catch (err) {
              console.log(name, JSON.stringify({ passed: false, error: String(err).slice(0,120) }));
              errors++;
              return "";
            }
          };
          const html = await check("frontend", "https://slatfit.com.br/", /<div id=["']root["']/i);
          await check("backend", "https://api.slatfit.com.br/", /"status"\s*:\s*"ok"/i);
          if (html) {
            const match = html.match(/<script[^>]*\bsrc=["']([^"']+\.js)["']/i);
            if (match) {
              try {
                const url = new URL(match[1], "https://slatfit.com.br/");
                const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
                const asset = await response.text();
                console.log("browser-js", JSON.stringify({
                  status: response.status,
                  bytes: asset.length,
                  sentryDsnDomainInEntrypoint: asset.includes("ingest.us.sentry.io"),
                }));
                if (!response.ok) errors++;
              } catch (err) {
                console.log("browser-js", JSON.stringify({ error: String(err).slice(0,120) }));
                errors++;
              }
            } else {
              console.log("browser-js", "No entry script found; cannot inspect Sentry bundle");
            }
          }
          if (errors) process.exitCode = 1;
          NODE
