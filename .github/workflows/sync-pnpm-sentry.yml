name: Synchronize pnpm lockfile for Sentry (temporary)
on:
  push:
    branches:
      - fix/sync-pnpm-lockfile-sentry
    paths:
      - .github/workflows/sync-pnpm-sentry.yml
jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Synchronize pnpm dependencies and verify build
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "fix: synchronize pnpm lockfile for Sentry React"
            git push
          fi
